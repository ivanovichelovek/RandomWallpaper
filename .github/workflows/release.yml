name: release

# Installers for all three platforms, built, installed and started on the
# runner, then published as a GitHub release the in-app updater reads.
#
#   git tag v1.1.0 && git push origin v1.1.0    → build, test, publish
#   Actions → release → Run workflow            → build and test only
#
# Every asset is named by randomwallpaper.update.asset_name() — the same
# function the updater looks them up with.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  NFPM_VERSION: "2.47.0"

jobs:
  version:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version=$(python3 -c 'import randomwallpaper; print(randomwallpaper.__version__)')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A tag that disagrees with the code would publish an update the
          # updater then offers forever: it compares against __version__.
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match __version__ $version" >&2
            exit 1
          fi

  linux:
    # A hung step fails in minutes, not after GitHub's six-hour default.
    timeout-minutes: 30
    needs: version
    # The oldest supported Ubuntu sets the glibc floor for everything bundled.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      # Present at build time so PyInstaller bundles them: whatever the
      # build machine lacks, the package would have to find on the user's,
      # and xcb-cursor & co. are not on every desktop.
      - name: Qt runtime libraries, to bundle
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libwayland-egl1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1
      - run: uv sync --locked --extra build
      - run: uv run packaging/make_icons.py
        env: { QT_QPA_PLATFORM: offscreen }
      - run: uv run pyinstaller --noconfirm packaging/pyinstaller.spec
      - name: nfpm
        run: |
          curl -fsSL --retry 4 -o nfpm.tgz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          tar xzf nfpm.tgz nfpm && sudo mv nfpm /usr/local/bin/
      - run: packaging/linux/build-packages.sh
        env: { PYTHON: .venv/bin/python }
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/packages/*
          if-no-files-found: error

  linux-install:
    timeout-minutes: 20
    needs: [version, linux]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: archlinux:latest
            prepare: pacman -Syu --noconfirm
            install: pacman -U --noconfirm /p/*.pkg.tar.zst
            remove: pacman -R --noconfirm random-wallpaper
          - image: debian:12
            prepare: apt-get update
            install: apt-get install -y /p/*.deb
            remove: apt-get remove -y random-wallpaper
          - image: ubuntu:22.04
            prepare: apt-get update
            install: apt-get install -y /p/*.deb
            remove: apt-get remove -y random-wallpaper
          - image: fedora:latest
            prepare: "true"
            install: dnf install -y /p/*.rpm
            remove: dnf remove -y random-wallpaper
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: tests/install }
      - uses: actions/download-artifact@v4
        with: { name: linux, path: p }
      - name: Install, check, run, remove
        run: |
          docker run --rm -v "$PWD/p:/p:ro" -v "$PWD/tests/install:/t:ro" \
            "${{ matrix.image }}" sh -c '
              ${{ matrix.prepare }} >/dev/null &&
              sh /t/check_linux.sh "${{ needs.version.outputs.version }}" \
                "${{ matrix.install }}" "${{ matrix.remove }}"'

  windows:
    timeout-minutes: 40
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --locked --extra build
      - run: uv run packaging/make_icons.py
        env: { QT_QPA_PLATFORM: offscreen }
      - run: uv run pyinstaller --noconfirm packaging/pyinstaller.spec
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Build the installer
        shell: pwsh
        run: |
          $v = "${{ needs.version.outputs.version }}"
          $name = uv run python -c "from randomwallpaper.update import asset_name; print(asset_name('$v', kind='windows'))"
          $name = [IO.Path]::GetFileNameWithoutExtension($name.Trim())
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$v" "/DOutputName=$name" packaging\windows\installer.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install, check, run, uninstall
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\installer\*.exe | Select-Object -First 1).FullName
          tests\install\check_windows.ps1 -Version "${{ needs.version.outputs.version }}" -Setup $setup
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/installer/*.exe
          if-no-files-found: error

  macos:
    timeout-minutes: 30
    needs: version
    # Apple silicon, macOS 13+ (what the PySide6 wheel is built for). An
    # Intel build would need an Intel runner; see README.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      # --extra macos: PyObjC in the bundle, so the wallpaper is set through
      # NSWorkspace. Without it every minute tick goes through System Events
      # and asks for the Automation permission from a background agent.
      - run: uv sync --locked --extra build --extra macos
      - run: uv run packaging/make_icons.py
        env: { QT_QPA_PLATFORM: offscreen }
      - run: iconutil -c icns packaging/macos/icon.iconset -o packaging/macos/icon.icns
      - run: uv run pyinstaller --noconfirm packaging/pyinstaller.spec
      - run: packaging/macos/build-pkg.sh
        env: { PYTHON: .venv/bin/python }
      - name: Install, check, run, remove
        run: tests/install/check_macos.sh "${{ needs.version.outputs.version }}" "$(ls dist/installer/*.pkg)"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/installer/*.pkg
          if-no-files-found: error

  publish:
    timeout-minutes: 15
    if: github.ref_type == 'tag'
    needs: [version, linux-install, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: assets, merge-multiple: true }
      - name: Checksums the updater verifies every download against
        working-directory: assets
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Random Wallpaper ${{ needs.version.outputs.version }}" \
            --generate-notes
