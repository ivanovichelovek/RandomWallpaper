name: android

# The Android app: built with pyside6-android-deploy, installed on an
# emulator, started, and walked through every tab (packaging/android/main.py
# has the tour). The screenshots and the logcat are the run's artifacts:
#   gh run download <id>
on:
  push:
    branches: [android]
    paths-ignore: ["README.md"]
  workflow_dispatch:

env:
  PYSIDE_VERSION: "6.12.0"
  NDK_VERSION: "28.2.13676358"
  ARCH: x86_64
  PACKAGE: dev.ivanc.randomwallpaper

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }

      - name: SDK packages the deploy tool wants
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;$NDK_VERSION" >/dev/null
          echo "ANDROID_SDK=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Host tools, outside the project
        run: |
          python -m venv ~/deploy-venv
          # The deploy tool's own requirements-android.txt, which pip does not install.
          ~/deploy-venv/bin/pip install -q "PySide6==$PYSIDE_VERSION" buildozer cython \
            jinja2 pkginfo tqdm "packaging==24.1"
          echo "PYTHON=$HOME/deploy-venv/bin/python" >> "$GITHUB_ENV"
          # buildozer looks for cython on PATH, and pip-installs with --user
          # unless it sees a virtualenv.
          echo "VIRTUAL_ENV=$HOME/deploy-venv" >> "$GITHUB_ENV"
          echo "$HOME/deploy-venv/bin" >> "$GITHUB_PATH"

      - name: Android wheels
        run: |
          mkdir -p ~/wheels && cd ~/wheels
          base=https://download.qt.io/official_releases/QtForPython
          for pkg in pyside6 shiboken6; do
            name=$(curl -sf "$base/$pkg/" | grep -o "href=\"[^\"]*$PYSIDE_VERSION-[^\"]*android_$ARCH\.whl\"" | head -n1 | cut -d'"' -f2)
            echo "$pkg: $name"
            curl -sfL -o "$name" "$base/$pkg/$name"
          done
          ls -l
          echo "WHEELS=$HOME/wheels" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ env.PYSIDE_VERSION }}-${{ env.ARCH }}

      - name: Icons
        run: |
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 >/dev/null
          ~/deploy-venv/bin/pip install -q platformdirs
          QT_QPA_PLATFORM=offscreen "$PYTHON" packaging/make_icons.py

      - name: Build
        run: packaging/android/build-apk.sh 2>&1 | tee build.log; test "${PIPESTATUS[0]}" -eq 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/android/*.apk
          if-no-files-found: error

  screenshots:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: apk, path: apk }
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: packaging/android/tour.sh apk/*.apk shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screenshots
          path: shots/
