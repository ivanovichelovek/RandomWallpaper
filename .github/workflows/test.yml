name: test

# The only real cross-platform verification this project gets: the calendar
# and file-handling core plus a headless UI smoke test, run on all three
# target OSes. Development happens on Linux alone, so this is what catches an
# AppKit import missing on macOS or a ctypes call that only resolves on
# Windows before a user does.
#
# uv throughout: it resolves against uv.lock (committed, so every job — and
# every contributor — installs the exact versions this was tested against)
# and manages its own Python download per OS, so there is no separate
# setup-python step to keep in sync with requires-python.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Qt needs a handful of X11/GL libraries to even load its "offscreen"
      # platform plugin on a bare Linux runner — macOS and Windows runners
      # ship what Qt needs already.
      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      # --locked: fail rather than silently re-resolve if uv.lock is out of
      # date with pyproject.toml — the same guarantee `npm ci` gives over
      # `npm install`. --extra macos is marker-gated in pyproject.toml
      # (sys_platform == 'darwin'), so pip — and uv — simply skip that
      # dependency on Linux and Windows rather than failing.
      - name: Install the package
        run: uv sync --locked --extra macos

      - name: Calendar / file-handling suite (offline parts + two live downloads)
        run: uv run tests/test_core.py
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Headless UI construction smoke test
        run: uv run tests/smoke_ui.py
        env:
          QT_QPA_PLATFORM: offscreen

      - name: The platform's scheduler accepts the generated timer
        if: runner.os != 'Linux'
        run: uv run tests/check_scheduler.py

      - name: Report which wallpaper backend this OS resolved to
        run: uv run random-wallpaper --backend
        env:
          QT_QPA_PLATFORM: offscreen

  # Installers are built, installed and started by release.yml — on a tag, or
  # by hand from the Actions tab (Run workflow) to try them without publishing.
