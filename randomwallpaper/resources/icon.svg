<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Random Wallpaper</title>

  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B1E2E"/>
      <stop offset="1" stop-color="#0C0D14"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E3350"/>
      <stop offset="1" stop-color="#171A28"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="30" y="38" width="72" height="56" rx="3"/>
    </clipPath>
    <!-- A crescent as two arcs degenerates when the endpoints sit exactly one
         diameter apart, so subtract one disc from another instead. -->
    <mask id="crescent">
      <circle cx="74" cy="58" r="14" fill="#fff"/>
      <circle cx="82" cy="54" r="12" fill="#000"/>
    </mask>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#ground)"/>

  <!-- the frame behind: the next wallpaper in the strip, waiting its turn -->
  <rect x="40" y="26" width="72" height="56" rx="3"
        fill="none" stroke="#A9A1F5" stroke-opacity="0.28" stroke-width="2"/>

  <!-- the frame in view -->
  <g clip-path="url(#frame)">
    <rect x="30" y="38" width="72" height="56" fill="url(#sky)"/>
    <!-- the same moon noctalia puts on the desktop -->
    <circle cx="74" cy="58" r="14" fill="#F2D98C" mask="url(#crescent)"/>
    <circle cx="46" cy="52" r="1.4" fill="#E6E7F0" opacity="0.85"/>
    <circle cx="58" cy="46" r="1" fill="#E6E7F0" opacity="0.6"/>
    <circle cx="38" cy="63" r="1" fill="#E6E7F0" opacity="0.5"/>
    <!-- horizon -->
    <path d="M30 94V80l14-11 12 9 13-7 15 11 18-8v20z" fill="#0E0F16" opacity="0.92"/>
  </g>
  <rect x="30" y="38" width="72" height="56" rx="3"
        fill="none" stroke="#F2D98C" stroke-width="2"/>

  <!-- film perforations: this is one frame of many -->
  <g fill="#8B90A8" opacity="0.55">
    <rect x="16" y="44" width="7" height="7" rx="1.5"/>
    <rect x="16" y="59" width="7" height="7" rx="1.5"/>
    <rect x="16" y="74" width="7" height="7" rx="1.5"/>
    <rect x="109" y="44" width="7" height="7" rx="1.5"/>
    <rect x="109" y="59" width="7" height="7" rx="1.5"/>
    <rect x="109" y="74" width="7" height="7" rx="1.5"/>
  </g>
</svg>
